<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="{{seo.description}}"
    />
    <meta name="author" content="{{profile.name}}" />
    <meta name="theme-color" content="#eaeaeb" />

    <!-- Open Graph / Meta Compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{seo.url}}" />
    <meta property="og:title" content="{{seo.title}}" />
    <meta
      property="og:description"
      content="{{seo.description}}"
    />
    <meta property="og:image" content="{{profile.avatar}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{seo.title}}" />
    <meta name="twitter:description" content="{{seo.description}}" />
    <meta name="twitter:image" content="{{profile.avatar}}" />

    <!-- JSON-LD Estruturado para AEO / SGE -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{profile.name}}",
        "jobTitle": "{{profile.subtitle}}",
        "url": "{{seo.url}}",
        "image": "{{profile.avatar}}",
        "knowsAbout": [
          {{#each seo.skills}}
            "{{this}}"{{#unless @last}},{{/unless}}
          {{/each}}
        ],
        "sameAs": [
          {{#each links}}
            "{{this.url}}"{{#unless @last}},{{/unless}}
          {{/each}}
        ]
      }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>{{seo.title}}</title>

    <!-- Preload crítico da fonte editorial local para eliminar FOIT/FOUT -->
    <link
      rel="preload"
      href="/src/assets/fonts/Melodrama/Melodrama-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>

  <body data-page="home">
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    <!-- Container principal -->
    <main id="main-content" class="app-container">
      
      <!-- [DESKTOP ONLY] Card Esquerdo: Formulário WhatsApp & Links -->
      <section class="profile-card desktop-only" aria-labelledby="desktop-heading">
        <div class="card-header anim-el" style="text-align: left; align-items: flex-start; padding-bottom: 2rem;">
          <h1 id="desktop-heading" class="profile-name" style="font-family: var(--font-serif); font-size: clamp(2rem, 5vw, 3rem); font-weight: 400;">Vamos Conversar</h1>
        </div>
        
        <!-- Links em Pílula [DESKTOP] -->
        <nav class="links-section anim-el" aria-label="Links Sociais Desktop" style="flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 0.8rem; margin-top: -1rem; margin-bottom: 2rem;">
          {{#each links}}
          <a href="{{this.url}}" target="_blank" rel="noopener noreferrer" class="link-item" style="width: auto; padding: 0.6rem 1.2rem; font-size: 0.85rem;">
            {{this.text}}
          </a>
          {{/each}}
        </nav>

        <form id="whatsapp-form" class="contact-form anim-el" aria-label="Formulário de Contato Direto">
          <!-- Campo Honeypot para neutralização de bots e scrapers automatizados -->
          <div style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
            <label for="_hp_company" class="sr-only">Não preencha este campo</label>
            <input type="text" name="_hp_company" id="_hp_company" tabindex="-1" autocomplete="off" aria-label="Honeypot" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="firstName" class="sr-only">Nome</label>
              <input type="text" id="firstName" name="firstName" placeholder="Nome" aria-label="Seu primeiro nome" required autocomplete="given-name" />
            </div>
            <div class="form-group">
              <label for="lastName" class="sr-only">Sobrenome</label>
              <input type="text" id="lastName" name="lastName" placeholder="Sobrenome" aria-label="Seu sobrenome" autocomplete="family-name" />
            </div>
          </div>

          <div class="form-group">
            <label for="message" class="sr-only">Mensagem</label>
            <textarea id="message" name="message" placeholder="Mensagem" rows="1" aria-label="Sua mensagem para Victor Cardoso" required></textarea>
          </div>

          <div class="form-submit-container">
            <button type="submit" id="whatsapp-submit-btn" class="submit-btn" aria-label="Iniciar Conversa no WhatsApp">Iniciar Conversa no WhatsApp</button>
          </div>
        </form>

        <footer class="contact-footer anim-el">
          <div class="contact-info">
            <span class="info-label">LOCALIZAÇÃO</span>
            <p>{{contact.location}}</p>
          </div>
          <div class="contact-info">
            <span class="info-label">E-MAIL</span>
            <p><a href="mailto:{{contact.email}}" style="color: inherit; text-decoration: none;">{{contact.email}}</a></p>
          </div>
        </footer>
        
        <!-- Grade de Ícones Sociais [DESKTOP] -->
        <div class="social-icons-grid anim-el" style="margin-top: 2rem; justify-content: flex-start; gap: 1.5rem;">
          <a href="https://instagram.com/abaxu_artes" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="mailto:victorcardosovc1@gmail.com" aria-label="Email">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </a>
          <a href="https://wa.me/5511977440146" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </a>
        </div>
      </section>

      <!-- HERO COVER: Usado no mobile (topo) e no desktop (direita) -->
      <section class="hero-cover" aria-label="Imagem de destaque">
        <!-- Circular Badge [DESKTOP ONLY] -->
        <div class="circular-badge desktop-only" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path id="circlePath" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="transparent" />
            <text>
              <textPath href="#circlePath" startOffset="0%" textLength="215" font-family="sans-serif" font-size="8.5" font-weight="bold" letter-spacing="0.1em">VAMOS TRABALHAR • VAMOS TRABALHAR • </textPath>
            </text>
          </svg>
        </div>
        <img
          src="{{profile.avatar}}"
          alt="{{profile.avatarAlt}}"
          loading="eager"
          fetchpriority="high"
          width="420"
          height="480"
        />
      </section>

      <!-- [MOBILE ONLY] LinkTree Clássico -->
      <section class="profile-card mobile-only" aria-labelledby="mobile-heading">
        <header class="card-header anim-el">
          <h1 id="mobile-heading" class="profile-name">{{profile.name}}</h1>
          <p class="profile-subtitle">{{profile.subtitle}}</p>
        </header>

        <!-- Links Minimalistas -->
        <nav class="links-section anim-el" aria-label="Links Principais">
          {{#each links}}
          <a href="{{this.url}}" target="_blank" rel="noopener noreferrer" class="link-item">
            {{this.text}}
          </a>
          {{/each}}
        </nav>

        <!-- Grade de Ícones Sociais -->
        <div class="social-icons-grid anim-el" aria-label="Redes Sociais">
          <a href="https://instagram.com/abaxu_artes" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="mailto:victorcardosovc1@gmail.com" aria-label="Email">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </a>
          <a href="https://wa.me/5511977440146" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </a>
        </div>

        <footer class="anim-el text-center">
          <a href="{{footer.url}}" target="_blank" rel="noopener noreferrer">
            &copy; {{footer.year}} {{footer.name}}
          </a>
        </footer>
      </section>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
